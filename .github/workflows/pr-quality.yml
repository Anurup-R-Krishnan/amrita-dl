name: PR Quality
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
jobs:
  check:
    name: Anti Slop
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: peakoss/anti-slop@v0.3.0
        with:
          exempt-author-association: "none"
